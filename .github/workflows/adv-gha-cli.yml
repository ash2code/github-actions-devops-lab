name: advanced github actions python cli 
run-name: adv-gha-cli #${{ github.run_name }}

on:
  push:
    branches: [main]

    paths:
      - adv-gha-cli/app.py
      - .github/workflows/adv-gha-cli.yml

  workflow_dispatch:
    inputs:
      run_type:
        description: "select the type of run"
        required: true
        type: choice
        options:
          - quick
          - full

jobs:
  adv-gha-cli:
    runs-on: ubuntu-latest

    defaults:
      run: 
        working-directory: adv-gha-cli

    steps:
      - name: code checkout 
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: install dependencies
        run: pip install -r requirements.txt
      
      - name: run lint
        run: ruff check .

      - name: run python tests
        if: ${{ inputs.run_type == 'quick' }}
        run: python -m pytest -v tests/

