name: python cli project
run-name: demo cli project #${{ github.run_number }}

on:
  push:
    branches: [ main ]
    paths:
      - sample_python_cli/**
      - .github/workflows/python-demo.yml

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            BUILD_NUMBER: ${{ github.run_number }}
        
        steps:
            - name: code checkout
              uses: action/checkout@v3
            
            - name: Docker login 
              uses: docker/login-action@v4 
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name: docker build
              run: |
                docker build -t ${{secrets.DOCKER_USERNAME}}/python_cli:${{ github.run_number }} ./sample_python_cli
            
            - name: Trivy Image Scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ secrets.DOCKER_USERNAME }}/python-demo:${{env.BUILD_NUMBER}}
                format: 'json'
                output: 'python-cli-trivy-report.json'
            
            - name: docker image push 
              run: 
                docker push ${{secrets.DOCKER_USERNAME}}/python_cli:${{ github.run_number }}
              
      