name: Reusable CI Demo

on:
  push:
    branches: [main]
    paths:
      - reusable-ci/**
      - .github/workflows/reusable-ci-demo.yml
      - .github/workflows/reusable-python-ci.yml

  workflow_dispatch:

jobs:
  python-ci:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      working-directory: reusable-ci
      python-version: "3.12"