name: demo project
run-name: demo project #${{ github.run_number }}

on:
  push:
    branches: [ main ]
    paths:
      - sample_python_project/**
      - .github/workflows/python-demo.yml

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v3 

      - 
        name: Docker login 
        uses: docker/login-action@v4 
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build-Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/python-demo:${{env.BUILD_NUMBER}} ./sample_python_project
        
      - name: Trivy Image Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/python-demo:${{env.BUILD_NUMBER}}
          format: 'table'
      
      - name: Push Docker Image
        run : |
          docker push ${{ secrets.DOCKER_USERNAME }}/python-demo:${{env.BUILD_NUMBER}}
